name: Stale Issues and PRs

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Mark and close stale issues and PRs
        uses: actions/stale@v11
        with:
          stale-issue-message: "This issue has been automatically marked as stale due to 60 days of inactivity. It will be closed in 30 days if no further activity occurs."
          stale-pr-message: "This pull request has been automatically marked as stale due to 60 days of inactivity. It will be closed in 30 days if no further activity occurs."
          close-issue-message: "Closing this issue due to prolonged inactivity. Please reopen if this is still relevant."
          close-pr-message: "Closing this pull request due to prolonged inactivity. Please reopen if work should continue."
          days-before-stale: 60
          days-before-close: 30
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: "pinned,security"
          exempt-pr-labels: "pinned,security"
